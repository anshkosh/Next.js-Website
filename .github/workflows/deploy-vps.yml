name: Deploy website to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VPS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Send the exact tested commit over restricted SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/anshkosh-deploy-key"
          known_hosts="$RUNNER_TEMP/anshkosh-known-hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"
          git archive --format=tar "$GITHUB_SHA" | gzip |
            ssh -T -i "$key" \
              -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
      - name: Verify the public site serves this commit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            https://www.anshkosh.com/.well-known/release.json |
            jq --exit-status --arg sha "$GITHUB_SHA" '.commit == $sha'
