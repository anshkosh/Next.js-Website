name: Startup launch browser tests
on:
  workflow_call:
  push:
    branches: ['Anshkosh-Website/Rinu']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journeys:
    runs-on: ubuntu-24.04
    # Separate runners give each group its own database, Redis, server and limits.
    strategy:
      fail-fast: false
      matrix:
        suite: [startup, accounts, public]
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: anshkosh_e2e
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-test-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test -d anshkosh_e2e" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:isolated-test-password@127.0.0.1:5432/anshkosh_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ''
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: isolated-e2e-secret-not-for-production-2026
      BREVO_API_KEY: test-only-no-external-delivery
      EMAIL_FROM: testing@example.test
      R2_ACCESS_KEY_ID: testing
      R2_SECRET_ACCESS_KEY: testing
      R2_BUCKET_NAME: uploads
      R2_ACCOUNT_ID: testing
      E2E_TEST_MODE: '1'
      E2E_PRODUCTION: '1'
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: isolated-browser-fixture
      TURNSTILE_SECRET_KEY: isolated-turnstile-test-secret
      CLAMAV_PORT: '33101'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Verify leaderboard scoring against PostgreSQL
        run: npx tsx scripts/test-startup-signals-postgres.ts
        env:
          SIGNALS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify concurrent account quotas against PostgreSQL
        run: npx tsx scripts/test-startup-quotas-postgres.ts
        env:
          QUOTA_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify team and featured quotas and update rollback against PostgreSQL
        run: npx tsx scripts/test-recheck-invariants-postgres.ts
        env:
          INVARIANTS_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify moderation publication and concurrent free-tier budget against PostgreSQL
        run: npx tsx scripts/test-moderation-postgres.ts
        env:
          MODERATION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Verify public signal cache correctness against PostgreSQL
        run: npx tsx scripts/test-public-signals-cache-postgres.ts
        env:
          PERFORMANCE_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
      # Sanitize-only upload mode validates and rewrites PDFs with qpdf (lib/uploads/qpdf.ts); it fails closed without it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qpdf && qpdf --version
      - run: npx playwright install --with-deps chromium
      - name: Build the isolated production app once
        run: npm run build
      - name: Run the isolated browser group
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = startup ]; then
            # Untagged future tests stay covered by the startup group.
            npx playwright test --grep-invert '@accounts|@public'
          else
            npx playwright test --grep "@$SUITE"
          fi
      - name: Preserve browser timings and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ matrix.suite }}
          path: |
            test-results/
            playwright-report/
          retention-days: 3
  # Preserve the existing required check name while collecting all matrix groups.
  browser:
    needs: journeys
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all browser groups to pass
        env:
          RESULT: ${{ needs.journeys.result }}
        run: test "$RESULT" = success
