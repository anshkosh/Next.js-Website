# Dedicated upload scanner; do not expose port 3310 outside loopback.
Foreground yes
TCPAddr 127.0.0.1
TCPSocket 3310
DatabaseDirectory /var/lib/clamav
MaxThreads 2
MaxQueue 8
ConcurrentDatabaseReload no
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 20M
MaxRecursion 8
AlertExceedsMax yes
AlertEncryptedDoc yes
ReadTimeout 15
CommandReadTimeout 10
ScanPDF yes
ScanArchive yes
